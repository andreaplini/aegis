name: Genera documenti DOCX

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'Makefile'
      - 'config/tool-versions.env'
      - 'README.md'
      - '.github/workflows/build-docx.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'Makefile'
      - 'config/tool-versions.env'
      - 'README.md'
      - '.github/workflows/build-docx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docx:
    name: Esporta RAD e SDD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Legge la versione degli strumenti
        id: tool-versions
        run: |
          source config/tool-versions.env
          echo "pandoc=$PANDOC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Installa Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: ${{ steps.tool-versions.outputs.pandoc }}

      - name: Genera e verifica i DOCX
        run: make docs OUTPUT_DIR=build/docs

      - name: Pubblica i DOCX come artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentazione-docx
          path: build/docs/*.docx
          if-no-files-found: error
          retention-days: 30
