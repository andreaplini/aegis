name: Genera documenti DOCX

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'Makefile'
      - 'config/tool-versions.env'
      - 'config/documentation/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'README.md'
      - '.github/workflows/build-docx.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'Makefile'
      - 'config/tool-versions.env'
      - 'config/documentation/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'README.md'
      - '.github/workflows/build-docx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docx:
    name: Esporta RAD e SDD
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Legge la versione degli strumenti
        id: tool-versions
        run: |
          node_version="$(sed -n 's/^NODE_VERSION=//p' config/tool-versions.env)"
          pandoc_version="$(sed -n 's/^PANDOC_VERSION=//p' config/tool-versions.env)"
          if [[ ! "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "NODE_VERSION deve contenere una versione numerica completa." >&2
            exit 1
          fi
          if [[ ! "$pandoc_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "PANDOC_VERSION deve contenere una versione numerica valida." >&2
            exit 1
          fi
          printf 'node=%s\n' "$node_version" >> "$GITHUB_OUTPUT"
          printf 'pandoc=%s\n' "$pandoc_version" >> "$GITHUB_OUTPUT"

      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.tool-versions.outputs.node }}

      - name: Installa gli strumenti Mermaid
        run: npm ci --prefix config/documentation

      - name: Installa Chromium headless
        run: npm exec --prefix config/documentation -- puppeteer browsers install chrome-headless-shell

      - name: Installa Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: ${{ steps.tool-versions.outputs.pandoc }}

      - name: Genera e verifica i DOCX
        env:
          PUPPETEER_CONFIG: config/documentation/puppeteer-ci.json
        run: make verify-docs OUTPUT_DIR=build/docs

      - name: Pubblica i DOCX come artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentazione-docx
          path: build/docs/*.docx
          if-no-files-found: error
          retention-days: 30
