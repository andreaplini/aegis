name: Genera documenti DOCX

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'Makefile'
      - 'README.md'
      - '.github/workflows/build-docx.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - '.agents/skills/**'
      - 'AGENTS.md'
      - 'Makefile'
      - 'README.md'
      - '.github/workflows/build-docx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docx:
    name: Esporta RAD e SDD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verifica documentazione e regole di progetto
        run: make check-docs

      - name: Installa Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1

      - name: Genera i DOCX
        run: |
          mkdir -p build/docs
          pandoc --from=gfm --to=docx --standalone --reference-doc=docs/template/template.docx docs/RAD.md --output=build/docs/rad-is.docx
          pandoc --from=gfm --to=docx --standalone --reference-doc=docs/template/template.docx docs/SDD.md --output=build/docs/sdd-is.docx

      - name: Pubblica i DOCX come artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentazione-docx
          path: build/docs/*.docx
          if-no-files-found: error
          retention-days: 30
