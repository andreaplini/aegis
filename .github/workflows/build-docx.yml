name: Genera documenti DOCX

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.md'
      - 'docs/template.docx'
      - '.github/workflows/build-docx.yml'
  pull_request:
    paths:
      - 'docs/*.md'
      - 'docs/template.docx'
      - '.github/workflows/build-docx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docx:
    name: Esporta RAD e SDD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Installa Pandoc
        uses: pandoc/actions/setup@v1

      - name: Genera i DOCX
        run: |
          mkdir -p build/docs
          pandoc --from=gfm --to=docx --standalone --reference-doc=docs/template.docx docs/RAD.md --output=build/docs/rad-is.docx
          pandoc --from=gfm --to=docx --standalone --reference-doc=docs/template.docx docs/SDD.md --output=build/docs/sdd-is.docx

      - name: Pubblica i DOCX come artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: documentazione-docx
          path: build/docs/*.docx
          if-no-files-found: error
          retention-days: 30
